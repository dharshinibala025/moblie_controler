name: Build & Release APK

# Manual workflow: fix code -> commit/push -> run this -> new APK lands on
# https://github.com/dharshinibala025/moblie_controler/releases/latest/download/app-release.apk
# The APK is always named app-release.apk so the "latest" link never breaks.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (tag + versionName), e.g. 1.0.1'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Version code (integer, must increase), e.g. 2'
        required: true
        default: '2'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install NDK/build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "platform-tools" > /dev/null

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PversionName=${{ github.event.inputs.version_name }} \
            -PversionCode=${{ github.event.inputs.version_code }}

      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          tag="v${{ github.event.inputs.version_name }}"
          # Delete a previous release with the same tag (idempotent re-run)
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" \
            --title "Smart Classroom Controller v${{ github.event.inputs.version_name }}" \
            --notes "Release build ${{ github.event.inputs.version_name }} (versionCode ${{ github.event.inputs.version_code }}). Optimized: R8 minified, device-only ABIs." \
            "$apk"
